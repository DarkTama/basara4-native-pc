name: Game won't launch / crashes on startup
description: Black screen, instant close, "prepare failed", param.sfo errors, or startup crash
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most launch failures come from an incomplete or misplaced game dump (missing `param.sfo`,
        missing `eboot.bin`, wrong folder selected). Please check the [README setup section](https://github.com/DarkTama/basara4-native-pc#readme)
        first, as it covers the folder layout and requirements expected by the launcher.

  - type: input
    id: version
    attributes:
      label: Port version
      description: Shown in the launcher title bar and under Tools (e.g. v1.1.5)
      placeholder: v1.1.5
    validations:
      required: true

  - type: dropdown
    id: game_version
    attributes:
      label: Game update version
      description: PS4 title ID is CUSA01159
      options:
        - "01.00 base only"
        - "with update CUSA01159-patch"
        - "not sure"
    validations:
      required: true

  - type: dropdown
    id: dlc_folder
    attributes:
      label: DLC folder set
      description: Have you set an extracted DLC folder in the launcher?
      options:
        - "yes"
        - "no"
    validations:
      required: true

  - type: textarea
    id: folder_screenshot
    attributes:
      label: Selected game folder screenshot
      description: Attach a screenshot of the folder you selected in the launcher, showing `eboot.bin` and the `sce_sys` folder (containing `param.sfo`).
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: Exact error message
      description: Copy the full text shown by the launcher or popup dialog. Do not paraphrase it.
    validations:
      required: true

  - type: textarea
    id: crash_report_or_log
    attributes:
      label: Crash Diagnostic Report / user/last_run.log
      description: Paste the full Crash Diagnostic report (starting with `=== Sengoku Basara 4 PC — Crash Diagnostic Report ===`) or contents of `user/last_run.log`.
      render: text
    validations:
      required: true
