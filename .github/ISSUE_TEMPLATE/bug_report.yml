name: Bug report
description: Gameplay, graphics, audio, or input bugs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, please search existing issues first to check if it has already been reported.
        If your issue is related to translation, font rendering, or broken textures from the English patch, please use the **English patch issue** template instead.

  - type: input
    id: version
    attributes:
      label: Port version
      description: Shown in the launcher title bar and under Tools (e.g. v1.1.5)
      placeholder: v1.1.5
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: "e.g. RX 6600, Adrenalin 24.3.1 / RTX 3070, GeForce 551.86"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "e.g. Ryzen 7 5700X / Core i5-12400"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11 23H2 / Arch Linux (Wine 9.0)"
    validations:
      required: true

  - type: dropdown
    id: upscaling
    attributes:
      label: Upscaling setting
      description: Launcher upscaling option used when the bug occurred
      options:
        - "Off"
        - "FSR 1"
        - "FSR 3.1"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: input_device
    attributes:
      label: Controller / input used
      placeholder: "e.g. DualSense (pad1), Xbox Series controller, Keyboard + Mouse"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: Describe what went wrong and what you expected to happen
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the game with character X
        2. Enter stage Y
        3. Perform move Z
    validations:
      required: true

  - type: textarea
    id: crash_report
    attributes:
      label: Crash Diagnostic Report
      description: If the game crashed, paste the full text from the launcher's Crash Diagnostic window (starting with `=== Sengoku Basara 4 PC — Crash Diagnostic Report ===`).
      render: text
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: user/last_run.log
      description: Drag and drop or attach `user/last_run.log` from the port folder. Highly recommended for crashes, audio issues, or graphical glitches.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Attach in-game screenshots or video showing the problem.
    validations:
      required: false
